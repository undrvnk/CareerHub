{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <h1>Compose New Message to {{ receiver.first_name }} {{ receiver.last_name }}</h1>
  <div class="row mt-4">
    <div class="col-md-8">
      <form method="post">
        {% csrf_token %}

        <p>
          <label for="subject">Subject:</label>
          <input type="text" name="subject" required class="form-control" id="subject" value="">
        </p>
        <p>
          <label for="body">Body:</label>
          <textarea name="body" required class="form-control" id="body" rows="6"></textarea>
        </p>

        <button type="submit" class="btn btn-success">Send</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
