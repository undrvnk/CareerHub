{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h1>My Applications</h1>
    <div class="row mt-4">
        {% for application in applications %}
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">{{ application.job.title }}</h5>
                    <h6 class="card-subtitle mb-2 text-muted">{{ application.job.company }}</h6>
                    <p class="card-text">Status: {{ application.status }}</p>
                    <p class="card-text">Applied on: {{ application.created_at }}</p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
