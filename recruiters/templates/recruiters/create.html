{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <h1>Post a New Job</h1>
  <div class="row mt-4">
    <div class="col-md-8">
      <form method="post">
        {% csrf_token %}

        <p>
          <label for="title">Title:</label>
          <input type="text" name="title" required class="form-control" id="title" value="">
        </p>

        <p>
          <label for="company">Company:</label>
          <input type="text" name="company" required class="form-control" id="company" value="">
        </p>

        <p>
          <label for="description">Description:</label>
          <textarea name="description" required class="form-control" id="description" rows="6"></textarea>
        </p>

        <p>
          <label for="location">Location (address):</label>
          <div class="input-group">
            <input type="text" name="location" required class="form-control" id="location" placeholder="123 Main St, City, ST">
            <button id="geocodeBtn" class="btn btn-outline-secondary" type="button">Find on map</button>
          </div>
          <small class="text-muted">Type the address, click “Find on map”, then drag the pin if needed.</small>
        </p>

        <!-- Hidden fields for precise coordinates (filled by the map) -->
        <input type="hidden" name="lat" id="id_lat" value="">
        <input type="hidden" name="lng" id="id_lng" value="">

        <div class="mb-3">
          <div id="map" class="w-100 rounded border" style="height:50vh;"></div>
        </div>

        <p>
          <label for="salary_range">Salary Range:</label>
          <input type="text" name="salary_range" required class="form-control" id="salary_range" placeholder="$120k–$150k">
        </p>

        <p>
          <label for="required_skills">Required Skills (comma-separated):</label>
          <input type="text" name="required_skills" required class="form-control" id="required_skills" placeholder="Python, Django, Postgres">
        </p>

        <p>
          <label for="visa_sponsorship">Visa Sponsorship:</label>
          <select name="visa_sponsorship" id="visa_sponsorship" class="form-control" required>
            <option value="yes">Yes</option>
            <option value="no" selected>No</option>
          </select>
        </p>

        <button type="submit" class="btn btn-success">Post Job</button>
      </form>
    </div>
  </div>
</div>

<!-- Leaflet CSS/JS (CDN) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // Get hidden inputs + address field
  const latInput = document.getElementById("id_lat");
  const lngInput = document.getElementById("id_lng");
  const addrInput = document.getElementById("location");

  // Start centered on the US
  const startLat = 39.8;
  const startLng = -98.6;
  const startZoom = 4;

  // Init map + base layer
  const map = L.map('map').setView([startLat, startLng], startZoom);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  // Draggable marker; keep hidden inputs in sync
  let marker = L.marker([startLat, startLng], { draggable: true }).addTo(map);

  function syncHidden(ll) {
    latInput.value = ll.lat.toFixed(6);
    lngInput.value = ll.lng.toFixed(6);
  }
  syncHidden(marker.getLatLng());

  marker.on("dragend", () => syncHidden(marker.getLatLng()));

  // Simple free geocoding via Nominatim (good for dev/prototype)
  async function geocode(q) {
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    const data = await res.json();
    return data && data.length ? { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) } : null;
  }

  document.getElementById("geocodeBtn").addEventListener("click", async () => {
    const q = (addrInput.value || "").trim();
    if (!q) { addrInput.focus(); return; }
    try {
      const hit = await geocode(q);
      if (!hit) { alert("Address not found. Try a fuller address."); return; }
      const ll = [hit.lat, hit.lon];
      map.setView(ll, 16);
      marker.setLatLng(ll);
      syncHidden(marker.getLatLng());
    } catch (e) {
      console.warn(e);
      alert("Geocoding failed. Please try again.");
    }
  });

</script>
{% endblock %}
