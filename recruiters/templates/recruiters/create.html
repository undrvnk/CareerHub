{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h1>Post a New Job</h1>
    <div class="row mt-4">
        <div class="col-md-8">
            <form method="post">
                {% csrf_token %}
                <p>
  <label for="title">Title:</label>
  <input type="text" name="title" required class="form-control" id="title" value="{{ template_data.post.title }}">
</p>

<p>
  <label for="company">Company:</label>
  <input type="text" name="company" required class="form-control" id="company" value="{{ template_data.post.company }}">
</p>

<p>
  <label for="description">Description:</label>
  <textarea name="description" required class="form-control" id="description">{{ template_data.post.description }}</textarea>
</p>

<p>
  <label for="location">Location:</label>
  <input type="text" name="location" required class="form-control" id="location" value="{{ template_data.post.location }}">
</p>

<p>
  <label for="salary_range">Salary Range:</label>
  <input type="text" name="salary_range" required class="form-control" id="salary_range" value="{{ template_data.post.salary_range }}">
</p>

<p>
  <label for="required_skills">Required Skills (comma-separated):</label>
  <input type="text" name="required_skills" required class="form-control" 
         id="required_skills" value="{% if template_data.skills %}{{ template_data.skills|join:", " }}{% endif %}">
</p>

<p>
  <label for="visa_sponsorship">Visa Sponsorship:</label>
  <select name="visa_sponsorship" id="visa_sponsorship" class="form-control" required>
    <option value="yes" {% if template_data.post.visa_sponsorship == "yes" %}selected{% endif %}>Yes</option>
    <option value="no" {% if template_data.post.visa_sponsorship == "no" %}selected{% endif %}>No</option>
  </select>
</p>


                <button type="submit" class="btn btn-primary">Post Job</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
