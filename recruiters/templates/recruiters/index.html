{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h1>Available Jobs</h1>
    <div class="row mt-4">
        {% for post in posts %}
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">{{ post.title }}</h5>
                    <h6 class="card-subtitle mb-2 text-muted">{{ post.company }}</h6>
                    <p class="card-text">{{ post.description|truncatewords:30 }}</p>
                    <a href="{% url 'posts.detail' post.id %}" class="btn btn-primary">View Details</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
