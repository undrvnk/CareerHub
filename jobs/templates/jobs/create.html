{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h1>Post a New Job</h1>
    <div class="row mt-4">
        <div class="col-md-8">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success">Post Job</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
